# ══════════════════════════════════════════════
#              HildaDragon — Mensajes
# ══════════════════════════════════════════════
#
# Soporta colores & y hex &#RRGGBB.
# {prefix} se reemplaza por el valor de "prefix" definido abajo.
# Cada mensaje puede tener sus propios placeholders {entre_llaves},
# indicados en el comentario de cada sección.
#
# ══════════════════════════════════════════════

prefix: "&#AA33FF&lHildaDragon &8» &f"

general:
  no-permission: "&cNo tienes permiso."
  config-reloaded: "&aConfig recargada."
  # Valor usado como %killer% cuando el dragón muere por timeout (sin killer)
  no-killer: "Nadie"
  # Se muestra al jugador al conectarse si tenía recompensas pendientes de un evento anterior
  pending-rewards-delivered: "{prefix}&aRecibiste recompensas pendientes de un evento anterior."

# Menú GUI — etiquetas de los botones de navegación
# Los TÍTULOS de cada vista se configuran en menus.yml
gui:
  nav-top: "&a➜ Top del evento"
  nav-hall-of-fame: "&a➜ Hall of Fame"
  nav-info: "&b◀ Volver"

# Recompensas en dinero (Vault)
rewards:
  # placeholders: {amount} — ya formateado por la economía (ej. $5,000.00)
  money-received: "{prefix}&aHas recibido &#AA33FF{amount}&a por el evento del Dragón Ancestral."

event:
  already-active: "&cEl dragón ya está activo."
  countdown-in-progress: "&cEl countdown ya está en curso."
  no-event-or-countdown: "&cNo hay ningún evento o countdown activo."
  countdown-started: "&aCountdown iniciado."
  dragon-spawned: "&aDragón spawneado."
  event-stopped: "&aEvento detenido."

# /hildadragon info
info:
  title: "{prefix}Estado"
  status-active: "&7Estado&8: &aACTIVO &8(dragón vivo)"
  # placeholders: {current}, {max}
  hp: "&7HP&8: &f{current} &8/ &f{max}"
  # placeholders: {count}
  participants: "&7Participantes&8: &f{count}"
  status-countdown: "&7Estado&8: &eEN COUNTDOWN"
  # placeholders: {time}
  time-remaining: "&7Tiempo restante&8: &f{time}"
  status-inactive: "&7Estado&8: &cINACTIVO"
  # placeholders: {next}, {time}
  next-event: "&7Próximo evento&8: &f{next} &8(en &f{time}&8)"

# /hildadragon top evento
top:
  title: "{prefix}Top daño — Evento actual"
  no-event-active: "&7No hay ningún evento activo en este momento."
  no-damage-yet: "&7Nadie ha dañado al dragón aún."
  # placeholders: {medal}, {player}, {damage}
  entry: "&8■ {medal} &8» &f{player} &8| &#AA33FF{damage} dmg"
  # placeholders: {rank}, {damage}
  my-position: "&8■ &7Tu posición&8: &f#{rank} &8| &#AA33FF{damage} dmg"

# /hildadragon top
hall-of-fame:
  title: "{prefix}Hall of Fame — Daño histórico"
  no-stats: "&7Aún no hay estadísticas registradas."
  # placeholders: {medal}, {player}, {damage}, {events}
  entry: "&8■ {medal} &8» &f{player} &8| &#AA33FF{damage} dmg total &8| &7{events} eventos"
  # placeholders: {damage}, {events}
  my-stats: "&8■ &7Tus stats&8: &#AA33FF{damage} dmg total &8| &7{events} eventos"

# Medallas usadas en "top" y "hall-of-fame" según la posición (1er, 2do, ...)
medals:
  positions:
    - "&6&l1er"
    - "&f&l2do"
    - "&c&l3er"
    - "&7&l4to"
    - "&7&l5to"
  # placeholders: {position} — usado a partir de la 6ta posición
  fallback: "&8{position}to"

# /hildadragon placeholders
placeholders-help:
  title: "{prefix}Placeholders disponibles"
  lines:
    - "&f "
    - "&d&lEVENTO ACTUAL"
    - "&8■ &7%hildadragon_active%          &8→ &ftrue / false"
    - "&8■ &7%hildadragon_countdown%       &8→ &ftiempo del countdown (ej. 4m 30s)"
    - "&8■ &7%hildadragon_hp%              &8→ &fHP actual del dragón"
    - "&8■ &7%hildadragon_hp_max%          &8→ &fHP máximo del dragón"
    - "&8■ &7%hildadragon_participants%    &8→ &fjugadores que han dañado al dragón"
    - "&f "
    - "&d&lPRÓXIMO EVENTO"
    - "&8■ &7%hildadragon_next%            &8→ &ftiempo restante con segundos (ej. 1d 6h 30m 15s)"
    - "&8■ &7%hildadragon_next_short%      &8→ &ftiempo restante sin segundos (ej. 1d 6h 30m)"
    - "&8■ &7%hildadragon_next_time%       &8→ &fhora exacta (ej. 18:00)"
    - "&8■ &7%hildadragon_next_day%        &8→ &fdía en español (ej. Sábado)"
    - "&8■ &7%hildadragon_next_full%       &8→ &fdía y hora (ej. Sábado 18:00)"
    - "&f "
    - "&d&lTOP EVENTO ACTUAL &8(se resetea al morir el dragón)"
    - "&8■ &7%hildadragon_top1_name%       &8→ &fjugador posición 1"
    - "&8■ &7%hildadragon_top1_damage%     &8→ &fdaño posición 1"
    - "&8■ &7&o...hasta top5_name / top5_damage"
    - "&f "
    - "&d&lJUGADOR — EVENTO ACTUAL"
    - "&8■ &7%hildadragon_my_damage%       &8→ &fdaño acumulado en el evento"
    - "&8■ &7%hildadragon_my_rank%         &8→ &fposición en el evento (- si no participó)"
    - "&f "
    - "&d&lHALL OF FAME &8(histórico acumulado)"
    - "&8■ &7%hildadragon_hall_1_name%     &8→ &fjugador posición 1 histórico"
    - "&8■ &7%hildadragon_hall_1_damage%   &8→ &fdaño total histórico posición 1"
    - "&8■ &7%hildadragon_hall_1_events%   &8→ &fnº de eventos participados posición 1"
    - "&8■ &7&o...hasta hall_5_name / hall_5_damage / hall_5_events"
    - "&f "
    - "&d&lJUGADOR — HISTÓRICO"
    - "&8■ &7%hildadragon_my_total_damage% &8→ &fdaño total en todos los eventos"
    - "&8■ &7%hildadragon_my_events%       &8→ &fnº de eventos en los que participó"

# /hildadragon (sin argumentos / argumento desconocido)
help:
  title: "{prefix}Comandos:"
  lines:
    - "&7/hildadragon start            &8- &fInicia el countdown"
    - "&7/hildadragon spawn            &8- &fSpawnea el dragón directo"
    - "&7/hildadragon stop             &8- &fDetiene el evento"
    - "&7/hildadragon top              &8- &fHall of Fame histórico"
    - "&7/hildadragon top evento       &8- &fTop del evento actual"
    - "&7/hildadragon info             &8- &fEstado del evento"
    - "&7/hildadragon placeholders     &8- &fLista todos los placeholders"
    - "&7/hildadragon reload           &8- &fRecarga la config"
