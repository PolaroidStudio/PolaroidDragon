# ══════════════════════════════════════════════
#      PolaroidDragon — Discord webhook
# ══════════════════════════════════════════════
#
# Announces the Ancestral Dragon's spawn and death in a Discord channel.
#
# How to get the webhook URL:
#  1. In Discord: Channel settings → Integrations → Webhooks → New webhook
#  2. Copy the URL and paste it below under "url"
#  3. Set "enabled: true"
#
# Available placeholders (the same as config.yml → phases.death/timeout):
#  %killer%       → the player who landed the final blow ("Nobody" on timeout)
#  %top1_name%    %top1_damage%
#  %top2_name%    %top2_damage%
#  %top3_name%    %top3_damage%
#  %top4_name%    %top4_damage%
#  %top5_name%    %top5_damage%
#
# The embed color is hexadecimal, e.g. "#289bd0"
# Title and description are plain Discord text (**bold**, *italic*, and so on)
# — do not use Minecraft color codes (& or §) here, Discord does not read them.
# ══════════════════════════════════════════════

enabled: false

url: ""

# Name and avatar the webhook shows (empty = use whatever Discord has configured)
username: "Ancestral Dragon"
avatar-url: ""

spawn:
  enabled: true
  embed:
    title: "✦ The Ancestral Dragon has awoken!"
    description: "The Ancestral Dragon has appeared in the End. Join the fight!"
    color: "#289bd0"

death:
  enabled: true
  embed:
    title: "✦ Ancestral Dragon defeated"
    description: |-
      **%killer%** landed the final blow.

      **Top damagers:**
      🥇 %top1_name% — %top1_damage% dmg
      🥈 %top2_name% — %top2_damage% dmg
      🥉 %top3_name% — %top3_damage% dmg
      4️⃣ %top4_name% — %top4_damage% dmg
      5️⃣ %top5_name% — %top5_damage% dmg
    color: "#289bd0"

timeout:
  enabled: false
  embed:
    title: "✦ Ancestral Dragon vanished"
    description: |-
      The Ancestral Dragon vanished for lack of challengers.

      **Top damagers:**
      🥇 %top1_name% — %top1_damage% dmg
      🥈 %top2_name% — %top2_damage% dmg
      🥉 %top3_name% — %top3_damage% dmg
    color: "#289bd0"
