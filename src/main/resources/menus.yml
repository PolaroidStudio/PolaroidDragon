# ══════════════════════════════════════════════
#            PolaroidDragon — Menus
# ══════════════════════════════════════════════
#
# Visual structure of the plugin's 3 views. Item TEXTS (names and lore)
# are edited in lang/messages_<language>.yml; here you configure titles, sizes,
# materials, slots and the background filler.
#
# Titles accept MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# The legacy & and &#RRGGBB codes still work, but use MiniMessage in new text.
#
# Polaroid style: a menu title is a label for the window, not a place to
# draw attention. It is always in <dark_gray><b>.
#
# Valid materials:
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#
# Slots of a 3-row inventory (size: 27):
#   Row 1:  0  1  2  3  4  5  6  7  8
#   Row 2:  9 10 11 12 13 14 15 16 17
#   Row 3: 18 19 20 21 22 23 24 25 26
#
# ── THE FILLER ────────────────────────────────
# enabled      true  = empty gaps are filled with a decorative pane.
#                      Leave it on true: besides looking better, it prevents a player
#                      from depositing items in the menu's free gaps.
#              false = the menu is left with empty gaps (not recommended).
# material     the block used as filler. The Polaroid standard is the black pane.
# name         name of the filler item. Only used if hide-tooltip is false.
# hide-tooltip true  = the pane shows no tooltip on hover (recommended:
#                      an empty tooltip following the cursor looks like a bug).
#              false = shows the "name" text.
#
# ══════════════════════════════════════════════

# ─────────────────────────────────────────────
#  VIEW: INFO  (/polaroiddragon info)
# ─────────────────────────────────────────────
info:
  title: "<dark_gray><b>ᴅʀᴀɢᴏɴ sᴛᴀᴛᴜs"
  size: 27

  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true

  items:
    # Central item showing the dragon's status.
    status:
      slot: 13
      material-active: DRAGON_HEAD    # when the event or countdown is active
      material-inactive: BARRIER      # when nothing is in progress

    # Navigation button → opens the current event Top.
    nav-to-top:
      slot: 22
      material: NETHER_STAR

# ─────────────────────────────────────────────
#  VIEW: CURRENT EVENT TOP  (/polaroiddragon top event)
# ─────────────────────────────────────────────
top-event:
  title: "<dark_gray><b>ᴇᴠᴇɴᴛ ᴛᴏᴘ"
  size: 27

  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true

  items:
    # Slots for the ranking heads (1st to 5th).
    # Add or remove slots to change how many places are shown.
    ranking:
      slots: [10, 11, 12, 13, 14]

    # Slot where the head of the player opening the menu is shown.
    my-position:
      slot: 4

    # Item shown when there is no active event or nobody has damaged the dragon.
    empty:
      slot: 13
      material: BARRIER

    # Navigation button → opens the Hall of Fame.
    nav-to-hall:
      slot: 18
      material: NETHER_STAR

    # Navigation button → returns to the status view.
    nav-to-info:
      slot: 22
      material: ARROW

# ─────────────────────────────────────────────
#  VIEW: HALL OF FAME  (/polaroiddragon top)
# ─────────────────────────────────────────────
hall-of-fame:
  title: "<dark_gray><b>ʜᴀʟʟ ᴏғ ғᴀᴍᴇ"
  size: 27

  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true

  items:
    # Slots for the all-time ranking heads (1st to 5th).
    ranking:
      slots: [10, 11, 12, 13, 14]

    # Slot where the head of the player opening the menu is shown.
    my-position:
      slot: 4

    # Item shown when no statistics have been recorded yet.
    empty:
      slot: 13
      material: BARRIER

    # Navigation button → opens the current event Top.
    nav-to-top:
      slot: 18
      material: NETHER_STAR

    # Navigation button → returns to the status view.
    nav-to-info:
      slot: 22
      material: ARROW
