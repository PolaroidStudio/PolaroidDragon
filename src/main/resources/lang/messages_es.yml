    - "<#f2c42f> • <#E9FDFB>%polaroiddragon_hall_1_name%     <#315a7a>→ <#b6c1ec>jugador histórico en la posición 1"
    - "<#f2c42f> • <#E9FDFB>%polaroiddragon_hall_1_damage%   <#315a7a>→ <#b6c1ec>daño histórico de la posición 1"
    - "<#f2c42f> • <#E9FDFB>%polaroiddragon_hall_1_events%   <#315a7a>→ <#b6c1ec>eventos de la posición 1"
    - "<#f2c42f> • <#315a7a><i>...hasta hall_5_name / hall_5_damage / hall_5_events"
    - ""
    - "<#289bd0>ᴊᴜɢᴀᴅᴏʀ — ʜɪsᴛᴏʀɪᴄᴏ"
    - "<#f2c42f> • <#E9FDFB>%polaroiddragon_my_total_damage% <#315a7a>→ <#b6c1ec>daño total en todos los eventos"
