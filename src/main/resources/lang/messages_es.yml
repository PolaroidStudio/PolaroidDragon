    - "<#f2c42f> • <#E9FDFB>%polaroiddragon_my_damage%       <#315a7a>→ <#b6c1ec>daño acumulado en este evento"
    - "<#f2c42f> • <#E9FDFB>%polaroiddragon_my_rank%         <#315a7a>→ <#b6c1ec>posición en este evento (- si no participó)"
