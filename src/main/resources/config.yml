          - '&f '
          - '&8■ &fEl Dragón Ancestral aparecerá en &#AA33FF%remaining_time%'
          - '&8■ &fPrepara tu mejor equipo y dirígete al &#AA33FFEnd'
          - '&8■ &fEl jugador con más daño recibirá la &#AA33FFmayor recompensa'
          - '&f '
          - '&7🀀 hildairis.com'
          - '&f '
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: false
        title: ''
        subtitle: ''
        fade-in: 10
        stay: 40
        fade-out: 10
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_GROWL

  spawn:
    notification:
      chat:
        enabled: true
        content:
          - '&f '
          - '&#9B76C4&m  &r &#9B76C4◦ Anuncios importantes ◦ &m  &r'
          - '&#7733CC&l¡&#7C36D5&lE&#8139DF&lL &#883FEB&lD&#8B42EE&lR&#8D44F0&lA&#8F46F1&lG&#9148F1&lÓ&#9249F2&lN &#974EF4&lA&#9950F5&lN&#9C52F6&lC&#9E55F7&lE&#A057F7&lS&#A25AF8&lT&#A45CF9&lR&#A65FFA&lA&#A861FB&lL&#AA63FC&l!'
          - '&f '
          - '&8■ &fEl &#AA33FFDragón Ancestral &fha aparecido en el &#AA33FFEnd'
          - '&8■ &f¡Haz el &#AA33FFmayor daño &fposible para ganar recompensas!'
          - '&8■ &fSolo los &#AA33FFTop 5 &fdañadores recibirán premios'
          - '&f '
          - '&7🀀 hildairis.com'
          - '&f '
      actionbar:
