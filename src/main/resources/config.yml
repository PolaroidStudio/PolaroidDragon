          - '&8■ &f&l1er &8» &f%top1_name% &8| &#AA33FF%top1_damage% dmg'
          - '&8■ &f&l2do &8» &f%top2_name% &8| &#AA33FF%top2_damage% dmg'
          - '&8■ &f&l3er &8» &f%top3_name% &8| &#AA33FF%top3_damage% dmg'
          - '&f '
