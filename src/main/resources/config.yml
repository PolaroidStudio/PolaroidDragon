# ══════════════════════════════════════════════
#            PolaroidDragon — Config
# ══════════════════════════════════════════════
#
# AVAILABLE PLACEHOLDERS (PlaceholderAPI)
# ─────────────────────────────────────────
#  CURRENT EVENT
#  %polaroiddragon_active%          → true / false (whether the dragon is alive)
#  %polaroiddragon_countdown%       → countdown time remaining (e.g. 4m 30s)
#  %polaroiddragon_hp%              → the dragon's current HP (e.g. 320)
#  %polaroiddragon_hp_max%          → the dragon's maximum HP (e.g. 400)
#  %polaroiddragon_participants%    → players who have damaged the dragon
#
#  NEXT EVENT
#  %polaroiddragon_next%            → time until the next event (e.g. 2h 15m)
#  %polaroiddragon_next_short%      → the same, in short form
#  %polaroiddragon_next_time%       → exact time of the next event (e.g. 18:00)
#  %polaroiddragon_next_day%        → day of the next event (e.g. Saturday)
#  %polaroiddragon_next_full%       → day and time (e.g. Saturday 18:00)
#
#  CURRENT EVENT TOP (reset when the dragon dies)
#  %polaroiddragon_top1_name%       → player in 1st place this event
#  %polaroiddragon_top1_damage%     → damage of 1st place this event
#  %polaroiddragon_top2_name%       → (same for 2, 3, 4, 5)
#  %polaroiddragon_top2_damage%
#  ... up to top5
#
#  THE PLAYER'S RANK IN THE CURRENT EVENT
#  %polaroiddragon_my_damage%       → the player's damage this event
#  %polaroiddragon_my_rank%         → the player's position this event (or - if not taking part)
#
#  HALL OF FAME — all-time totals across every event
#  %polaroiddragon_hall_1_name%     → player with the most all-time damage
#  %polaroiddragon_hall_1_damage%   → all-time damage of 1st place
#  %polaroiddragon_hall_1_events%   → number of events they took part in
#  %polaroiddragon_hall_2_name%     → (same for 2, 3, 4, 5)
#  ... up to hall_5
#
#  PLAYER STATISTICS (all-time)
#  %polaroiddragon_my_total_damage% → total damage across every event
#  %polaroiddragon_my_events%       → number of events they took part in
#
# ══════════════════════════════════════════════

# ── LANGUAGE ──────────────────────────────────
# The message file the plugin loads: lang/messages_<language>.yml
# Bundled: en (English, the base language) and es (Spanish).
# A key missing from your language falls back to English automatically,
# so an incomplete translation never leaves a blank message.
# To add a language, copy lang/messages_en.yml to lang/messages_<code>.yml
# and put that code here.
language: en

dragon:
  world: "world_the_end"
  spawn-x: 0
  spawn-y: 100
  spawn-z: 0
  # The dragon's HP. Vanilla = 200.0
  health: 400.0
  # The dragon's display name. Accepts MiniMessage; the gradient is the Polaroid identity.
  name: "<b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>Ancestral Dragon</gradient></b>"

event:
  auto-spawn: true

  # Timezone used for the schedule. Full list at:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Europe/Madrid"

  # Days and times the dragon spawns.
  # Format: DAY HH:mm (24h)
  # Valid days: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY
  schedule:
    - "FRIDAY 20:00"
    - "SATURDAY 18:00"
    - "SATURDAY 22:00"
    - "SUNDAY 18:00"

  # Seconds of warning before the spawn
  countdown-seconds: 300

  # Minimum players online for the event to start.
  # With fewer players, it is postponed to the next scheduled time.
  min-players: 5

  # Maximum minutes the dragon may stay alive.
  # When this is reached, rewards are paid to whoever took part and the next
  # event is scheduled. 0 = disabled.
  timeout-minutes: 30

  # How many top places receive a position reward
  top-size: 5

bossbar:
  enabled: true
  # Colors: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  color: PURPLE
  # Styles: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SEGMENTED_10
  # {current} = current HP, {max} = maximum HP
  title: "<b><#289bd0>Ancestral Dragon</b> <#315a7a>| <#E9FDFB>{current} <#315a7a>/ <#E9FDFB>{max} HP"

# ══════════════════════════════════════════════
#  NOTIFICATION PHASES
#  Each phase has: chat, actionbar, title, sound
#  The content is fully configurable.
#
#  Placeholders per phase:
#    countdown → %remaining_time%   (e.g. 4m 30s)
#    spawn     → (none extra)
#    death     → %killer%
#                %top1_name%  %top1_damage%
#                %top2_name%  %top2_damage%
#                %top3_name%  %top3_damage%
#                %top4_name%  %top4_damage%
#                %top5_name%  %top5_damage%
#    timeout   → same as death (killer = "Nobody")
# ══════════════════════════════════════════════
phases:

  countdown:
    notification-at: [ 300, 180, 60, 30, 10, 5, 4, 3, 2, 1 ]
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>ANCESTRAL DRAGON</gradient></b> <#315a7a>▬▬▬▬▬▬'
          - ''
          - '<#f2c42f> • <#E9FDFB>The Ancestral Dragon appears in <#f2c42f>%remaining_time%'
          - '<#f2c42f> • <#E9FDFB>Bring your best gear and head to the <#f2c42f>End'
          - '<#f2c42f> • <#E9FDFB>The player who deals the most damage gets the <#f2c42f>biggest reward'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: false
        title: ''
        subtitle: ''
        fade-in: 10
        stay: 40
        fade-out: 10
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_GROWL

  spawn:
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>THE ANCESTRAL DRAGON!</gradient></b> <#315a7a>▬▬▬'
          - ''
          - '<#f2c42f> • <#E9FDFB>The <#f2c42f>Ancestral Dragon <#E9FDFB>has appeared in the <#f2c42f>End'
          - '<#f2c42f> • <#E9FDFB>Deal as <#f2c42f>much damage as you can <#E9FDFB>to earn rewards'
          - '<#f2c42f> • <#E9FDFB>Only the <#f2c42f>top 5 <#E9FDFB>damagers receive prizes'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: true
        content: '<#289bd0>✦ Ancestral Dragon <#315a7a>┇ <#E9FDFB>It has appeared in the End!'
      title:
        enabled: true
        title: '<b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>✦ ANCESTRAL DRAGON ✦</gradient></b>'
        subtitle: '<#E9FDFB>Head to the End and fight!'
        fade-in: 10
        stay: 80
        fade-out: 20
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_GROWL

  death:
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>DRAGON DEFEATED!</gradient></b> <#315a7a>▬▬▬'
          - ''
          - '<#f2c42f> • <#f2c42f>%killer% <#E9FDFB>landed the final blow'
          - ''
          - '<#289bd0>ᴛᴏᴘ ᴅᴀᴍᴀɢᴇʀs'
          - '<#f2c42f> • <b>1sᴛ</b> <#E9FDFB>%top1_name% <#315a7a>| <#289bd0>%top1_damage% dmg'
          - '<#f2c42f> • <b>2ɴᴅ</b> <#E9FDFB>%top2_name% <#315a7a>| <#289bd0>%top2_damage% dmg'
          - '<#f2c42f> • <b>3ʀᴅ</b> <#E9FDFB>%top3_name% <#315a7a>| <#289bd0>%top3_damage% dmg'
          - '<#f2c42f> • <b>4ᴛʜ</b> <#E9FDFB>%top4_name% <#315a7a>| <#289bd0>%top4_damage% dmg'
          - '<#f2c42f> • <b>5ᴛʜ</b> <#E9FDFB>%top5_name% <#315a7a>| <#289bd0>%top5_damage% dmg'
          - ''
          - '<#95d027> • Prizes have been paid out automatically'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: true
        title: '<b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>✦ DRAGON DEFEATED ✦</gradient></b>'
        subtitle: '<#95d027>The prizes have been paid out!'
        fade-in: 10
        stay: 80
        fade-out: 20
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_DEATH

  # Notification for when the dragon despawns because the timeout ran out
  timeout:
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>DRAGON VANISHED</gradient></b> <#315a7a>▬▬▬'
          - ''
          - '<#f2c42f> • <#E9FDFB>The Ancestral Dragon has <#f2c42f>vanished <#E9FDFB>for lack of challengers'
          - '<#f2c42f> • <#E9FDFB>Rewards have been paid to everyone who took part'
          - ''
          - '<#289bd0>ᴛᴏᴘ ᴅᴀᴍᴀɢᴇʀs'
          - '<#f2c42f> • <b>1sᴛ</b> <#E9FDFB>%top1_name% <#315a7a>| <#289bd0>%top1_damage% dmg'
          - '<#f2c42f> • <b>2ɴᴅ</b> <#E9FDFB>%top2_name% <#315a7a>| <#289bd0>%top2_damage% dmg'
          - '<#f2c42f> • <b>3ʀᴅ</b> <#E9FDFB>%top3_name% <#315a7a>| <#289bd0>%top3_damage% dmg'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: false
        title: ''
        subtitle: ''
        fade-in: 10
        stay: 60
        fade-out: 10
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_DEATH

# ══════════════════════════════════════════════
#  REWARDS
#  {player} = the player's name
#
#  How it works:
#  - positions     → the top N damagers (as set by top-size)
#  - kill-bonus    → an extra bonus for whoever landed the final blow
#  - participation → players outside the top who cleared min-damage
#
#  money    → amount paid through Vault when available (works offline too).
#  commands → optional extra commands run from console (empty list = none).
#
#  min-damage → the minimum damage to qualify for the participation reward.
#               Top players always receive theirs regardless of this value.
# ══════════════════════════════════════════════
rewards:
  # Minimum damage to receive the participation reward (does not affect the top)
  min-damage: 10.0

  positions:
    1:
      money: 5000
      commands: []
    2:
      money: 2500
      commands: []
    3:
      money: 1000
      commands: []
    4:
      money: 500
      commands: []
    5:
      money: 250
      commands: []

  kill-bonus:
    enabled: true
    money: 1000
    commands: []

  participation:
    enabled: true
    money: 100
    commands: []
