# ══════════════════════════════════════════════
#            PolaroidDragon — Config
# ══════════════════════════════════════════════
#
# PLACEHOLDERS DISPONIBLES (PlaceholderAPI)
# ─────────────────────────────────────────
#  EVENTO ACTUAL
#  %polaroiddragon_active%          → true / false (si el dragón está vivo)
#  %polaroiddragon_countdown%       → tiempo restante del countdown (ej. 4m 30s)
#  %polaroiddragon_hp%              → HP actual del dragón (ej. 320)
#  %polaroiddragon_hp_max%          → HP máximo del dragón (ej. 400)
#  %polaroiddragon_participants%    → jugadores que han dañado al dragón
#
#  PRÓXIMO EVENTO
#  %polaroiddragon_next%            → tiempo hasta el próximo evento (ej. 2h 15m)
#  %polaroiddragon_next_time%       → hora exacta del próximo evento (ej. 18:00)
#
#  TOP EVENTO ACTUAL (se resetean al morir el dragón)
#  %polaroiddragon_top1_name%       → jugador posición 1 del evento actual
#  %polaroiddragon_top1_damage%     → daño posición 1 del evento actual
#  %polaroiddragon_top2_name%       → (ídem para 2, 3, 4, 5)
#  %polaroiddragon_top2_damage%
#  ... hasta top5
#
#  RANKING DEL JUGADOR EN EL EVENTO ACTUAL
#  %polaroiddragon_my_damage%       → daño acumulado del jugador en el evento actual
#  %polaroiddragon_my_rank%         → posición del jugador en el evento actual (o - si no participó)
#
#  HALL OF FAME — histórico acumulado de todos los eventos
#  %polaroiddragon_hall_1_name%     → jugador con más daño total histórico
#  %polaroiddragon_hall_1_damage%   → daño total histórico posición 1
#  %polaroiddragon_hall_1_events%   → nº de eventos en los que participó
#  %polaroiddragon_hall_2_name%     → (ídem para 2, 3, 4, 5)
#  ... hasta hall_5
#
#  ESTADÍSTICAS DEL JUGADOR (históricas)
#  %polaroiddragon_my_total_damage% → daño total acumulado en todos los eventos
#  %polaroiddragon_my_events%       → nº de eventos en los que participó
#
# ══════════════════════════════════════════════

# ── IDIOMA ────────────────────────────────────
# Archivo de textos que usa el plugin: lang/messages_<idioma>.yml
# Incluidos: en (inglés, idioma base) y es (español).
# Si una clave falta en tu idioma, se usa automáticamente la del inglés,
# así que una traducción incompleta nunca deja mensajes en blanco.
# Para añadir un idioma, copia lang/messages_en.yml a lang/messages_<codigo>.yml
# y pon aquí ese código.
language: es

dragon:
  world: "world_the_end"
  spawn-x: 0
  spawn-y: 100
  spawn-z: 0
  # HP del dragón. Vanilla = 200.0
  health: 400.0
  # Nombre visible del dragon. Acepta MiniMessage; el degradado es la identidad Polaroid.
  name: "<b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>Dragon Ancestral</gradient></b>"

event:
  auto-spawn: true

  # Zona horaria para los horarios. Lista completa en:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Europe/Madrid"

  # Días y horas en los que spawna el dragón.
  # Formato: DIA_EN_INGLES HH:mm (24h)
  # Días válidos: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY
  schedule:
    - "FRIDAY 20:00"
    - "SATURDAY 18:00"
    - "SATURDAY 22:00"
    - "SUNDAY 18:00"

  # Segundos de aviso antes del spawn
  countdown-seconds: 300

  # Jugadores mínimos online para que el evento inicie.
  # Si no hay suficientes jugadores, se pospone al siguiente horario.
  min-players: 5

  # Minutos máximos que el dragón puede estar vivo sin morir.
  # Si se alcanza este tiempo, se procesan las recompensas con quien haya participado
  # y se reprograma el siguiente evento. 0 = desactivado.
  timeout-minutes: 30

  # Cuántas posiciones del top reciben recompensa de posición
  top-size: 5

bossbar:
  enabled: true
  # Colores: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  color: PURPLE
  # Estilos: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SEGMENTED_10
  # {current} = HP actual, {max} = HP máximo
  title: "<b><#289bd0>Dragón Ancestral</b> <#315a7a>| <#E9FDFB>{current} <#315a7a>/ <#E9FDFB>{max} HP"

# ══════════════════════════════════════════════
#  FASES DE NOTIFICACIÓN
#  Cada fase tiene: chat, actionbar, title, sound
#  El contenido es 100% configurable.
#
#  Placeholders por fase:
#    countdown → %remaining_time%   (ej. 4m 30s)
#    spawn     → (ninguno adicional)
#    death     → %killer%
#                %top1_name%  %top1_damage%
#                %top2_name%  %top2_damage%
#                %top3_name%  %top3_damage%
#                %top4_name%  %top4_damage%
#                %top5_name%  %top5_damage%
#    timeout   → mismos que death (killer = "Nadie")
# ══════════════════════════════════════════════
phases:

  countdown:
    notification-at: [ 300, 180, 60, 30, 10, 5, 4, 3, 2, 1 ]
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>DRAGON ANCESTRAL</gradient></b> <#315a7a>▬▬▬▬▬▬'
          - ''
          - '<#f2c42f> • <#E9FDFB>El Dragón Ancestral aparecerá en <#f2c42f>%remaining_time%'
          - '<#f2c42f> • <#E9FDFB>Prepara tu mejor equipo y dirígete al <#f2c42f>End'
          - '<#f2c42f> • <#E9FDFB>El jugador que más daño haga recibirá la <#f2c42f>mayor recompensa'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: false
        title: ''
        subtitle: ''
        fade-in: 10
        stay: 40
        fade-out: 10
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_GROWL

  spawn:
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>¡EL DRAGON ANCESTRAL!</gradient></b> <#315a7a>▬▬▬'
          - ''
          - '<#f2c42f> • <#E9FDFB>El <#f2c42f>Dragón Ancestral <#E9FDFB>ha aparecido en el <#f2c42f>End'
          - '<#f2c42f> • <#E9FDFB>Haz el <#f2c42f>mayor daño posible <#E9FDFB>para ganar recompensas'
          - '<#f2c42f> • <#E9FDFB>Solo los <#f2c42f>5 mejores <#E9FDFB>dañadores recibirán premios'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: true
        content: '<#289bd0>✦ Dragón Ancestral <#315a7a>┇ <#E9FDFB>¡Ha aparecido en el End!'
      title:
        enabled: true
        title: '<b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>✦ DRAGON ANCESTRAL ✦</gradient></b>'
        subtitle: '<#E9FDFB>¡Dirígete al End y combate!'
        fade-in: 10
        stay: 80
        fade-out: 20
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_GROWL

  death:
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>¡DRAGON DERROTADO!</gradient></b> <#315a7a>▬▬▬'
          - ''
          - '<#f2c42f> • <#f2c42f>%killer% <#E9FDFB>ha dado el golpe final'
          - ''
          - '<#289bd0>ᴛᴏᴘ ᴅᴀÑᴀᴅᴏʀᴇs'
          - '<#f2c42f> • <b>1º</b> <#E9FDFB>%top1_name% <#315a7a>| <#289bd0>%top1_damage% dmg'
          - '<#f2c42f> • <b>2º</b> <#E9FDFB>%top2_name% <#315a7a>| <#289bd0>%top2_damage% dmg'
          - '<#f2c42f> • <b>3º</b> <#E9FDFB>%top3_name% <#315a7a>| <#289bd0>%top3_damage% dmg'
          - '<#f2c42f> • <b>4º</b> <#E9FDFB>%top4_name% <#315a7a>| <#289bd0>%top4_damage% dmg'
          - '<#f2c42f> • <b>5º</b> <#E9FDFB>%top5_name% <#315a7a>| <#289bd0>%top5_damage% dmg'
          - ''
          - '<#95d027> • Los premios se han entregado automáticamente'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: true
        title: '<b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>✦ DRAGON DERROTADO ✦</gradient></b>'
        subtitle: '<#95d027>¡Los premios han sido entregados!'
        fade-in: 10
        stay: 80
        fade-out: 20
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_DEATH

  # Notificación cuando el dragón muere por timeout (tiempo agotado)
  timeout:
    notification:
      chat:
        enabled: true
        content:
          - ''
          - '<#315a7a>▬▬▬ <b><gradient:#eb4b30:#f3842c:#f2c42f:#95d027>DRAGON DESAPARECIDO</gradient></b> <#315a7a>▬▬▬'
          - ''
          - '<#f2c42f> • <#E9FDFB>El Dragón Ancestral ha <#f2c42f>desaparecido <#E9FDFB>por falta de combatientes'
          - '<#f2c42f> • <#E9FDFB>Las recompensas se han entregado a los participantes'
          - ''
          - '<#289bd0>ᴛᴏᴘ ᴅᴀÑᴀᴅᴏʀᴇs'
          - '<#f2c42f> • <b>1º</b> <#E9FDFB>%top1_name% <#315a7a>| <#289bd0>%top1_damage% dmg'
          - '<#f2c42f> • <b>2º</b> <#E9FDFB>%top2_name% <#315a7a>| <#289bd0>%top2_damage% dmg'
          - '<#f2c42f> • <b>3º</b> <#E9FDFB>%top3_name% <#315a7a>| <#289bd0>%top3_damage% dmg'
          - ''
          - '<#315a7a>🀀 polaroid.studio'
          - ''
      actionbar:
        enabled: false
        content: ''
      title:
        enabled: false
        title: ''
        subtitle: ''
        fade-in: 10
        stay: 60
        fade-out: 10
      sound:
        enabled: true
        content: ENTITY_ENDER_DRAGON_DEATH

# ══════════════════════════════════════════════
#  RECOMPENSAS
#  {player} = nombre del jugador
#
#  Lógica:
#  - positions   → top N jugadores con más daño (según top-size)
#  - kill-bonus  → bono adicional al jugador que dio el golpe final
#  - participation → jugadores fuera del top que superaron min-damage
#
#  money    → cantidad entregada vía Vault si está disponible (funciona offline).
#  commands → comandos extra opcionales ejecutados por consola (lista vacía = ninguno).
#
#  min-damage → daño mínimo para ser elegible a recompensa de participation.
#               Los jugadores del top siempre reciben su recompensa sin importar este valor.
# ══════════════════════════════════════════════
rewards:
  # Daño mínimo para recibir la recompensa de participación (no afecta al top)
  min-damage: 10.0

  positions:
    1:
      money: 5000
      commands: []
    2:
      money: 2500
      commands: []
    3:
      money: 1000
      commands: []
    4:
      money: 500
      commands: []
    5:
      money: 250
      commands: []

  kill-bonus:
    enabled: true
    money: 1000
    commands: []

  participation:
    enabled: true
    money: 100
    commands: []
