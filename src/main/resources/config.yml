# ══════════════════════════════════════════════
#  RECOMPENSAS
#  {player} = nombre del jugador
#
#  Lógica:
#  - positions   → top N jugadores con más daño (según top-size)
#  - kill-bonus  → bono adicional al jugador que dio el golpe final
#  - participation → jugadores fuera del top que superaron min-damage
#
#  money    → cantidad entregada vía Vault si está disponible (funciona offline).
#  commands → comandos extra opcionales ejecutados por consola (lista vacía = ninguno).
#
#  min-damage → daño mínimo para ser elegible a recompensa de participation.
#               Los jugadores del top siempre reciben su recompensa sin importar este valor.
# ══════════════════════════════════════════════
rewards:
  # Daño mínimo para recibir la recompensa de participación (no afecta al top)
  min-damage: 10.0

  positions:
    1:
      money: 5000
      commands: []
    2:
      money: 2500
      commands: []
    3:
      money: 1000
      commands: []
    4:
      money: 500
      commands: []
    5:
      money: 250
      commands: []

  kill-bonus:
    enabled: true
    money: 1000
    commands: []

  participation:
    enabled: true
    money: 100
    commands: []
