        enabled: true
        content: ENTITY_ENDER_DRAGON_GROWL

  death:
    notification:
      chat:
        enabled: true
        content:
          - '&f '
          - '&#9B76C4&m  &r &#9B76C4◦ Anuncios importantes ◦ &m  &r'
          - '&#7733CC&l¡&#7C36D5&lE&#8139DF&lL &#883FEB&lD&#8B42EE&lR&#8D44F0&lA&#8F46F1&lG&#9148F1&lÓ&#9249F2&lN &#974EF4&lH&#9950F5&lA &#9C52F6&lS&#9E55F7&lI&#A057F7&lD&#A25AF8&lO &#A45CF9&lD&#A65FFA&lE&#A861FB&lR&#AA63FC&lR&#AC65FD&lO&#AE67FD&lT&#B06AFE&lA&#B26CFE&lD&#B46FFE&lO&#B671FF&l!'
          - '&f '
          - '&8■ &f%killer% &fha dado el golpe final'
          - '&f '
          - '&8■ &7&lTOP DAÑADORES'
          - '&8■ &f&l1er &8» &f%top1_name% &8| &#AA33FF%top1_damage% dmg'
