# ══════════════════════════════════════════════
#              HildaDragon — Config
# ══════════════════════════════════════════════
#
# PLACEHOLDERS DISPONIBLES (PlaceholderAPI)
# ─────────────────────────────────────────
#  EVENTO ACTUAL
#  %hildadragon_active%          → true / false (si el dragón está vivo)
#  %hildadragon_countdown%       → tiempo restante del countdown (ej. 4m 30s)
#  %hildadragon_hp%              → HP actual del dragón (ej. 320)
#  %hildadragon_hp_max%          → HP máximo del dragón (ej. 400)
#  %hildadragon_participants%    → jugadores que han dañado al dragón
#
#  PRÓXIMO EVENTO
#  %hildadragon_next%            → tiempo hasta el próximo evento (ej. 2h 15m)
#  %hildadragon_next_time%       → hora exacta del próximo evento (ej. 18:00)
#
#  TOP EVENTO ACTUAL (se resetean al morir el dragón)
#  %hildadragon_top1_name%       → jugador posición 1 del evento actual
#  %hildadragon_top1_damage%     → daño posición 1 del evento actual
#  %hildadragon_top2_name%       → (ídem para 2, 3, 4, 5)
#  %hildadragon_top2_damage%
#  ... hasta top5
#
#  RANKING DEL JUGADOR EN EL EVENTO ACTUAL
#  %hildadragon_my_damage%       → daño acumulado del jugador en el evento actual
#  %hildadragon_my_rank%         → posición del jugador en el evento actual (o - si no participó)
#
#  HALL OF FAME — histórico acumulado de todos los eventos
#  %hildadragon_hall_1_name%     → jugador con más daño total histórico
#  %hildadragon_hall_1_damage%   → daño total histórico posición 1
#  %hildadragon_hall_1_events%   → nº de eventos en los que participó
#  %hildadragon_hall_2_name%     → (ídem para 2, 3, 4, 5)
#  ... hasta hall_5
#
#  ESTADÍSTICAS DEL JUGADOR (históricas)
#  %hildadragon_my_total_damage% → daño total acumulado en todos los eventos
#  %hildadragon_my_events%       → nº de eventos en los que participó
#
# ══════════════════════════════════════════════

dragon:
  world: "world_the_end"
  spawn-x: 0
  spawn-y: 100
  spawn-z: 0
  # HP del dragón. Vanilla = 200.0
  health: 400.0
  name: "&#7733CC&lD&#8833DD&lr&#9933EE&la&#AA33FF&lg&#9933EE&lo&#8833DD&ln &#7733CC&lA&#6622BB&ln&#5511AA&lc&#4400AA&le&#5511AA&ls&#6622BB&lt&#7733CC&lr&#8833DD&la&#9933EE&ll"

event:
  auto-spawn: true

  # Zona horaria para los horarios. Lista completa en:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Europe/Madrid"

  # Días y horas en los que spawna el dragón.
  # Formato: DIA_EN_INGLES HH:mm (24h)
  # Días válidos: MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY
  schedule:
    - "FRIDAY 20:00"
    - "SATURDAY 18:00"
    - "SATURDAY 22:00"
    - "SUNDAY 18:00"

  # Segundos de aviso antes del spawn
  countdown-seconds: 300

  # Jugadores mínimos online para que el evento inicie.
  # Si no hay suficientes jugadores, se pospone al siguiente horario.
  min-players: 5

  # Minutos máximos que el dragón puede estar vivo sin morir.
  # Si se alcanza este tiempo, se procesan las recompensas con quien haya participado
  # y se reprograma el siguiente evento. 0 = desactivado.
  timeout-minutes: 30

  # Cuántas posiciones del top reciben recompensa de posición
  top-size: 5

bossbar:
  enabled: true
  # Colores: BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  color: PURPLE
  # Estilos: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SEGMENTED_10
  # {current} = HP actual, {max} = HP máximo
  title: "&#AA33FF&lDragón Ancestral &8| &f{current} &8/ &f{max} HP"

# ══════════════════════════════════════════════
#  FASES DE NOTIFICACIÓN
#  Cada fase tiene: chat, actionbar, title, sound
#  El contenido es 100% configurable.
#
#  Placeholders por fase:
#    countdown → %remaining_time%   (ej. 4m 30s)
#    spawn     → (ninguno adicional)
#    death     → %killer%
#                %top1_name%  %top1_damage%
#                %top2_name%  %top2_damage%
#                %top3_name%  %top3_damage%
#                %top4_name%  %top4_damage%
#                %top5_name%  %top5_damage%
#    timeout   → mismos que death (killer = "Nadie")
# ══════════════════════════════════════════════
phases:

  countdown:
    notification-at: [ 300, 180, 60, 30, 10, 5, 4, 3, 2, 1 ]
    notification:
      chat:
        enabled: true
        content:
          - '&f '
