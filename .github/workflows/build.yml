name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Runs the test suite as part of the phase; a failing test fails the build.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PolaroidDragon
          path: target/PolaroidDragon.jar
          if-no-files-found: error
